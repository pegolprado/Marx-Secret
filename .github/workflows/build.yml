name: MARX SECRET – testes e build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes-linux:
    name: Testes (Linux, offscreen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bibliotecas do Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - name: Testes automatizados
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Autodiagnóstico
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m marx_secret --self-test

  build-windows:
    name: Build, instalação e testes no Windows
    needs: testes-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Build completo (testes, PyInstaller, portátil, fonte, manual, Inno Setup)
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Python python

      - name: "Teste: instalação silenciosa"
        shell: pwsh
        run: |
          $dir = "C:\MarxSecretTeste"
          $p = Start-Process "release\MARX_SECRET_Setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$dir`"",'/TASKS=desktopicon' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Instalador retornou $($p.ExitCode)" }
          if (-not (Test-Path "$dir\MARX_SECRET.exe")) { throw "Executável não instalado" }
          if (-not (Test-Path "$dir\Manual_MARX_SECRET.pdf")) { throw "Manual não instalado" }
          $desk = @("$env:PUBLIC\Desktop\MARX SECRET.lnk", "$env:USERPROFILE\Desktop\MARX SECRET.lnk") | Where-Object { Test-Path $_ }
          if (-not $desk) { throw "Atalho da área de trabalho ausente" }
          $menu = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "MARX SECRET.lnk" -ErrorAction SilentlyContinue
          if (-not $menu) { throw "Atalho do Menu Iniciar ausente" }
          Write-Host "Instalação verificada: executável, manual e atalhos presentes."

      - name: "Teste: execução offline do aplicativo instalado"
        shell: pwsh
        run: |
          $exe = "C:\MarxSecretTeste\MARX_SECRET.exe"
          New-NetFirewallRule -DisplayName "MARX SECRET sem rede" -Direction Outbound -Program $exe -Action Block | Out-Null
          $p = Start-Process $exe -ArgumentList '--self-test','--report','C:\selftest_instalado.txt' -Wait -PassThru
          Get-Content C:\selftest_instalado.txt
          if ($p.ExitCode -ne 0) { throw "Autodiagnóstico do aplicativo instalado falhou" }

      - name: "Teste: versão portátil"
        shell: pwsh
        run: |
          Expand-Archive release\MARX_SECRET_Portable.zip -DestinationPath C:\PortatilTeste
          $exe = "C:\PortatilTeste\MARX SECRET Portable\MARX_SECRET.exe"
          if (-not (Test-Path "C:\PortatilTeste\MARX SECRET Portable\portable.flag")) { throw "portable.flag ausente" }
          $p = Start-Process $exe -ArgumentList '--self-test','--report','C:\selftest_portatil.txt' -Wait -PassThru
          Get-Content C:\selftest_portatil.txt
          if ($p.ExitCode -ne 0) { throw "Autodiagnóstico da versão portátil falhou" }

      - name: "Teste: desinstalação completa"
        shell: pwsh
        run: |
          $data = "$env:APPDATA\MARX SECRET"
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content "$data\marcador.txt" "dados do usuario"
          Start-Process "C:\MarxSecretTeste\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/PURGE=1' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "C:\MarxSecretTeste"); $i++) { Start-Sleep 1 }
          if (Test-Path "C:\MarxSecretTeste") { throw "Pasta de instalação não foi removida" }
          if (Test-Path $data) { throw "Dados do usuário não foram removidos com /PURGE=1" }
          if (Test-Path "$env:PUBLIC\Desktop\MARX SECRET.lnk") { throw "Atalho não removido" }
          Write-Host "Desinstalação completa verificada."

      - name: Publicar artefatos de entrega
        uses: actions/upload-artifact@v4
        with:
          name: MARX_SECRET_Entrega
          path: release/MARX_SECRET_Entrega
          if-no-files-found: error

      - name: Versão do aplicativo
        id: versao
        shell: pwsh
        run: |
          $v = (Select-String -Path marx_secret\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Publicar versão (branch principal ou tags v*)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: MARX SECRET Professional ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.versao.outputs.tag }}
          body: |
            **MARX SECRET Professional** – PRIVACIDADE. SEGURANÇA. INTELIGÊNCIA.

            | Pacote | Arquivo |
            |---|---|
            | Marx Secret - Instalação tradicional no Windows | `MARX_SECRET_Setup.exe` |
            | Marx Secret - Executar sem instalação tradicional | `MARX_SECRET_Portable.zip` |
            | Marx Secret - Projeto completo e código-fonte | `MARX_SECRET_Source.zip` |
            | Marx Secret - Manual de instalação e utilização | `Manual_MARX_SECRET.pdf` |

            Requisitos: Windows 10 (1809+) ou Windows 11, 64 bits. Não requer Python.
            Hashes SHA-256 em `SHA256SUMS.txt`.
          files: |
            release/MARX_SECRET_Setup.exe
            release/MARX_SECRET_Portable.zip
            release/MARX_SECRET_Source.zip
            release/Manual_MARX_SECRET.pdf
            release/SHA256SUMS.txt
